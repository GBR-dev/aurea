<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <!-- Eu deixo a coleção adaptada para celular, tablet e computador. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coleção | Áurea</title>

    <meta
        name="description"
        content="Conheça a coleção Áurea."
    >

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <header class="header">

        <div class="header-container">

            <a href="index.html" class="logo-link">

                <img
                    src="assets/images/logo/aurea-logo.png"
                    alt="Áurea"
                    class="logo"
                >

            </a>


            <button
                class="menu-mobile"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>


            <nav class="nav">

                <a href="index.html">
                    Início
                </a>

                <a href="colecao.html" class="ativo">
                    Coleção
                </a>

                <a href="sobre.html">
                    Sobre
                </a>

                <a href="contato.html">
                    Contato
                </a>

            </nav>

        </div>

    </header>


    <main class="pagina-colecao">

        <section class="cabecalho-pagina">

            <span>
                ÁUREA
            </span>

            <h1>
                Nossa coleção
            </h1>

            <p>
                Escolha sua peça favorita e conheça todos os detalhes.
            </p>

        </section>


        <section class="catalogo">

            <div class="filtros">

                <button
                    type="button"
                    class="filtro ativo"
                    data-categoria="Todos"
                >
                    Todos
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-categoria="Blusas"
                >
                    Blusas
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-categoria="Calças"
                >
                    Calças
                </button>

            </div>


            <!-- Eu deixo o JavaScript montar todos os produtos neste espaço. -->
            <div class="produtos"></div>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-conteudo">

            <div class="footer-marca">

                <img
                    src="assets/images/logo/aurea-logo.png"
                    alt="Áurea"
                >

                <p>
                    Seu estilo, sua essência!
                </p>

            </div>


            <div class="footer-links">

                <a href="index.html">
                    Início
                </a>

                <a href="colecao.html">
                    Coleção
                </a>

                <a href="sobre.html">
                    Sobre
                </a>

                <a href="contato.html">
                    Contato
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 Áurea. Todos os direitos reservados.
            </p>

        </div>

    </footer>


<!-- Eu carrego os produtos antes do script principal. -->
<script src="js/produtos.js"></script>

<!-- Eu carrego as funções gerais do site. -->
<script src="js/script.js"></script>

<!-- Eu carrego o carrinho para ele funcionar em todas as páginas. -->
<script src="js/carrinho.js"></script>
</body>

</html>
