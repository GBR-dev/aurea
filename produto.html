<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <!-- Eu deixo a página adaptada para celular, tablet e computador. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produto | Áurea</title>

    <meta
        name="description"
        content="Conheça os detalhes dos produtos Áurea."
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/images/logo/aurea-logo.png">

</head>


<body>

    <!-- Eu mantenho o mesmo cabeçalho das outras páginas. -->
    <header class="header">

        <div class="header-container">

            <a href="index.html" class="logo-link">

                <img
                    src="assets/images/logo/aurea-logo.png"
                    alt="Áurea"
                    class="logo"
                >

            </a>


            <button
                class="menu-mobile"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>


            <nav class="nav">

                <a href="index.html">
                    Início
                </a>

                <a href="colecao.html">
                    Coleção
                </a>

                <a href="sobre.html">
                    Sobre
                </a>

                <a href="contato.html">
                    Contato
                </a>

            </nav>

        </div>

    </header>


    <main>

        <!-- Eu deixo o JavaScript montar todos os detalhes do produto aqui. -->
        <section
            class="pagina-produto"
            id="produto-container"
        >

            <div class="produto-carregando">

                <p>
                    Carregando produto...
                </p>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-conteudo">

            <div class="footer-marca">

                <img
                    src="assets/images/logo/aurea-logo.png"
                    alt="Áurea"
                >

                <p>
                    Seu estilo, sua essência!
                </p>

            </div>


            <div class="footer-links">

                <a href="index.html">
                    Início
                </a>

                <a href="colecao.html">
                    Coleção
                </a>

                <a href="sobre.html">
                    Sobre
                </a>

                <a href="contato.html">
                    Contato
                </a>

            </div>


            <div class="footer-social">

                <a
                    href="https://www.instagram.com/useaurea.m/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Instagram
                </a>

                <a href="contato.html">
                    WhatsApp
                </a>

            </div>

        </div>


                <!-- Eu destaco as informações principais de compra no rodapé. -->
        <div class="rodape-confianca" aria-label="Informações de compra">
            <div class="selo-confianca">
                <svg class="icone-selo-confianca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ícone de pagamento">
                    <path d="M12 3 19 6v5c0 4.4-2.8 7.9-7 10-4.2-2.1-7-5.6-7-10V6l7-3Z"/>
                    <path d="m8.5 12 2.3 2.3 4.7-4.8"/>
                </svg>
                <span class="selo-confianca-texto">
                    <strong>Pagamento via Pix ou cartão</strong>
                    <small>Escolha sua forma de pagamento</small>
                </span>
            </div>

            <div class="selo-confianca">
                <svg class="icone-selo-confianca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ícone de clique">
                    <path d="M5 3v14l4-4 3 6 3-1.5-3-6h5L5 3Z"/>
                    <path d="m15.5 18.2 2 2 3.5-3.7"/>
                </svg>
                <span class="selo-confianca-texto">
                    <strong>Pedido em poucos cliques</strong>
                    <small>Prático do início ao fim</small>
                </span>
            </div>
        </div>
<div class="footer-bottom">

            <p>
                © 2026 Áurea. Todos os direitos reservados.
            </p>

        </div>

    </footer>

<!-- Eu carrego os produtos antes dos outros scripts. -->
<script src="js/produtos.js"></script>

<!-- Eu carrego as funções gerais do site. -->
<script src="js/script.js"></script>

<!-- Eu carrego o funcionamento específico da página do produto. -->
<script src="js/produto.js"></script>

<!-- Eu carrego o carrinho por último para ele encontrar
     o produto e os elementos que o produto.js criou. -->
<script src="js/carrinho.js"></script>

</body>

</html>
