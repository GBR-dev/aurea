<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produto | Áurea</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- ==========================================
         CABEÇALHO
         ========================================== -->

    <header>

        <a
            href="index.html"
            class="logo"
        >

            <img
                src="assets/images/logo/aurea-logo.png"
                alt="Logo Áurea"
            >

        </a>


        <!-- Menu para celular -->

        <button
            class="menu-mobile"
            type="button"
            aria-label="Abrir menu"
            aria-expanded="false"
        >
            ☰
        </button>


        <nav id="menu-navegacao">

            <a href="index.html#inicio">
                Início
            </a>

            <a href="index.html#colecao">
                Coleção
            </a>

            <a href="index.html#sobre">
                Sobre
            </a>

            <a href="index.html#contato">
                Contato
            </a>

            <a
                href="https://www.instagram.com/useaurea.m/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Instagram
            </a>

        </nav>

    </header>


    <main>

        <!--
            O JavaScript vai montar o produto
            dentro deste espaço.
        -->

        <section class="pagina-produto">

            <div id="produto-detalhes"></div>

        </section>

    </main>


    <!-- Dados dos produtos -->
    <script src="js/produtos.js"></script>

    <!-- Menu mobile -->
    <script src="js/script.js"></script>

    <!-- Lógica da página do produto -->
    <script src="js/produto.js"></script>

</body>

</html>
